<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشغلات المطلوب تعديلها</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#1e3a8a;--primary-light:#3b82f6;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--card:#ffffff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--soft:#f8fafc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--soft:#0f172a}}
:root[data-theme="dark"]{--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--soft:#0f172a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma,Arial,sans-serif}
body{background:linear-gradient(135deg,#0f172a,#1e3a8a 50%,#0f172a);background-color:#0f172a;min-height:100vh;padding:20px;color:var(--text)}
.container{max-width:1100px;margin:0 auto}
.header{background:var(--card);border-radius:24px;padding:36px 20px;text-align:center;margin-bottom:24px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.header h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;color:var(--primary-light);margin-bottom:8px}
.header p{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border-radius:18px;padding:18px;text-align:center;border-top:4px solid var(--primary-light)}
.stat.ok{border-color:var(--ok)}.stat.bad{border-color:var(--bad)}.stat.wait{border-color:var(--warn)}
.stat span{display:block;color:var(--muted);font-size:.9rem}
.stat b{font-size:2rem;font-weight:900}
.box{background:var(--card);border-radius:24px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar h2{font-size:1.4rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;padding:12px 22px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:0.2s}
.add{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff}
.add:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,.4)}
.refresh{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.refresh:hover{background:var(--border)}
.wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:var(--card)}
thead{background:linear-gradient(135deg,#0f172a,var(--primary))}
th{padding:16px;color:#fff;font-weight:700;white-space:nowrap}
td{padding:16px;text-align:center;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tr.done{background:rgba(16,185,129,.1)}tr.no{background:rgba(239,68,68,.1)}
.num{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:12px;background:var(--primary);color:#fff;font-weight:900}
.txt{text-align:right;font-weight:700;font-size:1.05rem}
.badge{display:inline-block;padding:7px 14px;border-radius:20px;font-weight:700;font-size:.85rem;white-space:nowrap}
.b-wait{background:rgba(245,158,11,.15);color:var(--warn)}.b-ok{background:rgba(16,185,129,.15);color:var(--ok)}.b-bad{background:rgba(239,68,68,.15);color:var(--bad)}
.acts{display:flex;gap:10px;justify-content:center}
.act{width:46px;height:46px;border-radius:14px;border:2px solid transparent;font-size:1.3rem;font-weight:900;cursor:pointer;transition:.2s}
.y{background:rgba(16,185,129,.15);color:var(--ok)}.y:hover,.y.on{background:var(--ok);color:#fff}
.n{background:rgba(239,68,68,.15);color:var(--bad)}.n:hover,.n.on{background:var(--bad);color:#fff}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;transition:0.2s}
.del:hover{color:var(--bad)}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.8);z-index:10;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.mc{background:var(--card);padding:28px;border-radius:22px;width:100%;max-width:460px;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.mc h3{text-align:center;margin-bottom:16px}
.mc input{width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;font-size:1rem;margin-bottom:16px;background:var(--soft);color:var(--text);outline:none}
.mc input:focus{border-color:var(--primary-light)}
.mb{display:flex;gap:10px}
.mb button{flex:1;padding:13px;border-radius:12px;border:0;font-weight:700;font-size:1rem;cursor:pointer}
.save{background:var(--primary-light);color:#fff}.cancel{background:var(--border);color:var(--text)}
.empty{padding:36px;color:var(--muted);text-align:center}
#loading{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--primary-light);color:#fff;padding:8px 20px;border-radius:20px;font-size:.9rem;font-weight:700;z-index:50;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#lastUpdate{font-size:.85rem;color:var(--muted);margin-top:8px;text-align:center}
</style>
</head>
<body>
<div id="loading">جاري التحميل...</div>
<div class="container">
  <div class="header">
    <h1>الشغلات المطلوب تعديلها</h1>
    <p>راجع كل مشكلة، واضغط ✓ إذا تعدلت أو ✗ إذا لم تتعدل</p>
    <div id="lastUpdate"></div>
  </div>
  <div class="stats">
    <div class="stat"><span>الإجمالي</span><b id="sT">0</b></div>
    <div class="stat ok"><span>تم التعديل ✓</span><b id="sO">0</b></div>
    <div class="stat bad"><span>لم تُعدّل ✗</span><b id="sB">0</b></div>
    <div class="stat wait"><span>قيد الانتظار</span><b id="sW">0</b></div>
  </div>
  <div class="box">
    <div class="bar">
      <h2>قائمة المشاكل</h2>
      <div class="actions">
        <button class="btn refresh" onclick="load(true)">🔄 تحديث</button>
        <button class="btn add" id="addBtn" onclick="openM()" style="display:none">+ إضافة مشكلة جديدة</button>
      </div>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th style="width:70px">#</th><th>المشكلة</th><th style="width:140px">الحالة</th><th style="width:170px">صح / غلط</th><th style="width:50px"></th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
</div>
<div class="modal" id="m">
  <div class="mc">
    <h3>إضافة مشكلة جديدة</h3>
    <input type="text" id="inp" placeholder="اكتب المشكلة هنا...">
    <div class="mb"><button class="save" onclick="addP()">إضافة</button><button class="cancel" onclick="closeM()">إلغاء</button></div>
  </div>
</div>

<script>
// ⚠️ هام: استبدل هذا الرابط برابط قاعدة بيانات Firebase الخاص بك إذا لم يكن هذا هو الرابط الصحيح
var DB = 'https://fixing-df0d2-default-rtdb.firebaseio.com';

// نظام تحقق بسيط وآمن للأدمن (كلمة المرور تُحفظ في الجلسة الحالية فقط)
var isAdmin = sessionStorage.getItem('isAdmin') === 'true';
var ADMIN_PASS = "Admin@2026"; // <-- غيّر كلمة المرور هذه إلى كلمة مرور قوية خاصة بك

function checkAdmin() {
  if (location.hash === '#admin' && !isAdmin) {
    var pass = prompt("أدخل كلمة مرور المسؤول:");
    if (pass === ADMIN_PASS) {
      sessionStorage.setItem('isAdmin', 'true');
      isAdmin = true;
      location.hash = ''; // إخفاء الهاش من الرابط للأمان
      render();
      note("✅ تم تفعيل صلاحيات المسؤول بنجاح", "ok");
    } else if (pass !== null) {
      alert("❌ كلمة المرور خاطئة");
    }
  }
}

var items = [], marks = {};
var SEED = [
  'المسعف يجيه بلاغ اطلاق نار',
  'تقدر تسجل تهريب وتهرب والميناء مغلق، تقدر تدخل على الميناء وهي مغلقة ولم يخصم أي خبرة، لازم نفعل حظر التجول في وقت الإغلاق',
  'شاحنة باقة البداية تطلع من كراج السيارة',
  'الأسعار في المتاجر جداً غالية',
  'لا يوجد شرح على أي وظيفة',
  'لازم نحرك السكوتر لبرا لأنه مش مبيّن',
  'مشاكل في المعرض الجديد: اسم السيارة وسعر السيارة مو نفس السيارة',
  'مركبات الهلال الأحمر ما نقدر نطلعها من الحجز',
  'مشكل خاصه بقطاع المكنيكي مسميات الرتب والوظيفه مختلفه',
  'مشكله مسما تم فتح التعديل او تم اغلاق التعديل وايضا فتح التوظيف',
  'ايضا في اضافه الفواتير لا يمكن تحديد من مستلم الفاتوره يوجد لاقرب شخص فقط',
  'ايضا في التوظيف لا يمكن تحديد الشخص يوجد لاقرب شخص فقط',
  'ايضا لما الشخص يفتح الكراج لا يمكنه تحديد اي ورسه او اي مربع الرجاء اضفتها',
  'ايضا عند اصلاح او تنظيف اي سياره للشخص يجب اظهار تلقائي للفتوره واضفه المبلغ',
  'اضافه mdt للتحكم بالورشه واضافه او توظيف اي موظف من اي مكن مو شرط الورشه',
  'في مشاكل في رسبنه او اضافه اي اشياء لتعديل الورشه',
  'اضافه حجز وكراج في ساحه الورشه في لوس مربع 10006',
  'اعاده ضبط لجميع السرقات لكشف اسعارها وكشف اخطاء اكتمال سرقتها', // تم حذف التكرار من هنا
  'المركبات أحياناً تعلق وتأخذ وقت لين تطلع من الجراج',
  'عند التحويل من وظيفة إلى adminjob ترجع الملابس لملابس المواطن وتنحل، ونحتاج نبقى بلبس الوظيفة (مثلاً العام) للتعامل مع التخريب. المطلوب: إضافة في قائمة الرقابة تختار منها الوظيفة فتجيك رتبتك من الديسكورد مع ملابس الوظيفة، وتختار السيارة اللي تطلعها من جراجك في الوظيفة',
  'الفلوس الغير شرعي في سرقات مبالغ فيها مثل محل الاسلحه في لوس يعطي ٨٠٠ ألف',
  'لما تفوت على متجر بدك تشتري شي منها تاخد وقت ل تشتغل ف منعمل عليها سبام ل تشتغل',
  'تعديل على السيارات ب المعرض حسب السعر و المستوى تكون السرعه',
  'عضله ال “E” بتظهر قفل السياره ولو مافي جنبنا سياره',
  'محل تعديل الأسلحه ما تقدر تعدل غير سلاح “الأوزي”',
  'بعض الاحيان لما ادخل بقاله بتكون مرسبنه ب حاله “blur” و ما نقدر نستخدم فيها الصراف او الشراء',
  'لما نفتح الخريطه بعطيك فوق متجر “code hub” لازم يكون عليها اسم المقاطعه',
  'بعض الأحيان لما العسكري يحاسب المجرم ب السجن بنقطع الصوت بين الطرفين و بصير كلشي مختفي و لونو رمادي',
  'الأوبجيكت تبع سرقه بيت العجوز مرفوع فوق لازم ننزلها لتحت'
];

function showLoading(show) {
  document.getElementById('loading').style.display = show ? 'block' : 'none';
}

function api(path, method, body) {
  return fetch(DB + path + '.json', {
    method: method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function note(t, type) {
  var n = document.getElementById('note');
  if (!n) {
    n = document.createElement('div');
    n.id = 'note';
    n.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:12px;z-index:20;font-weight:700;transition:opacity 0.3s';
    document.body.appendChild(n);
  }
  n.textContent = t;
  n.style.background = type === 'ok' ? 'var(--ok)' : '#ef4444';
  n.style.color = '#fff';
  n.style.display = 'block';
  setTimeout(function() { n.style.display = 'none'; }, 4000);
}

function load(isManual) {
  if (isManual) showLoading(true);
  api('/items').then(function(it) {
    if (it === null) {
      var seed = {};
      SEED.forEach(function(t, i) { seed[i + 1] = { id: i + 1, text: t }; });
      return api('/items', 'PUT', seed).then(function() { return seed; });
    }
    return it;
  }).then(function(it) {
    items = Object.values(it || {}).filter(Boolean).sort(function(a, b) { return a.id - b.id; });
    return api('/marks');
  }).then(function(m) {
    marks = m || {};
    render();
    if (isManual) {
      showLoading(false);
      note('✅ تم تحديث البيانات بنجاح', 'ok');
    }
    var now = new Date();
    document.getElementById('lastUpdate').textContent = 'آخر تحديث: ' + now.toLocaleTimeString('ar-SA');
  }).catch(function(err) {
    showLoading(false);
    console.error(err);
    note('⚠️ تعذر الاتصال بقاعدة البيانات', 'bad');
  });
}

function render() {
  var tb = document.getElementById('tb');
  tb.innerHTML = '';
  if (!items.length) {
    tb.innerHTML = '<tr><td colspan="5" class="empty">لا توجد مشاكل مسجلة حالياً.</td></tr>';
  }
  var o = 0, b = 0;
  items.forEach(function(p, i) {
    var st = marks[p.id] || 'wait';
    if (st === 'ok') o++;
    if (st === 'bad') b++;
    var tr = document.createElement('tr');
    tr.className = st === 'ok' ? 'done' : st === 'bad' ? 'no' : '';
    var lbl = st === 'ok' ? ['b-ok', '✓ تم التعديل'] : st === 'bad' ? ['b-bad', '✗ لم تُعدّل'] : ['b-wait', '⏳ قيد الانتظار'];
    tr.innerHTML = '<td><span class="num">' + (i + 1) + '</span></td><td class="txt"></td><td><span class="badge ' + lbl[0] + '">' + lbl[1] + '</span></td>' +
      '<td><div class="acts"><button class="act y' + (st === 'ok' ? ' on' : '') + '" onclick="setS(' + p.id + ',\'ok\')" title="تم التعديل">✓</button>' +
      '<button class="act n' + (st === 'bad' ? ' on' : '') + '" onclick="setS(' + p.id + ',\'bad\')" title="لم تُعدّل">✗</button></div></td>' +
      '<td>' + (isAdmin ? '<button class="del" onclick="delP(' + p.id + ')" title="حذف">🗑</button>' : '') + '</td>';
    tr.querySelector('.txt').textContent = p.text;
    tb.appendChild(tr);
  });
  document.getElementById('sT').textContent = items.length;
  document.getElementById('sO').textContent = o;
  document.getElementById('sB').textContent = b;
  document.getElementById('sW').textContent = items.length - o - b;
  document.getElementById('addBtn').style.display = isAdmin ? 'block' : 'none';
}

function setS(id, s) {
  var prev = marks[id] || 'wait';
  var next = (prev === s ? 'wait' : s);
  marks[id] = next;
  render(); // تحديث فوري للواجهة (Optimistic UI)
  api('/marks/' + id, 'PUT', next).catch(function() {
    marks[id] = prev; // التراجع عن التغيير إذا فشل الحفظ
    render();
    note('⚠️ تعذر حفظ التغيير', 'bad');
  });
}

function delP(id) {
  if (!confirm('هل أنت متأكد من حذف هذه المشكلة نهائياً؟')) return;
  var prevItems = items;
  items = items.filter(function(p) { return p.id !== id; });
  render();
  api('/items/' + id, 'DELETE').catch(function() {
    items = prevItems; // التراجع عند الفشل
    render();
    note('⚠️ تعذر الحذف', 'bad');
  });
  api('/marks/' + id, 'DELETE').catch(function() {});
}

function openM() {
  document.getElementById('m').classList.add('on');
  setTimeout(function() { document.getElementById('inp').focus(); }, 100);
}

function closeM() {
  document.getElementById('m').classList.remove('on');
  document.getElementById('inp').value = '';
}

function addP() {
  var t = document.getElementById('inp').value.trim();
  if (!t) return;
  var id = items.length ? Math.max.apply(null, items.map(function(p) { return p.id; })) + 1 : 1;
  var newItem = { id: id, text: t };
  items.push(newItem);
  render();
  closeM();
  api('/items/' + id, 'PUT', newItem).catch(function() {
    items.pop(); // التراجع عند الفشل
    render();
    note('⚠️ تعذر إضافة المشكلة', 'bad');
  });
}

// مستمعات الأحداث
document.getElementById('inp').addEventListener('keypress', function(e) { if (e.key === 'Enter') addP(); });
document.getElementById('m').addEventListener('click', function(e) { if (e.target === this) closeM(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeM(); });

// التهيئة الأولية
checkAdmin();
showLoading(true);
load(false);

// تحديث تلقائي كل 60 ثانية فقط (لتوفير استهلاك Firebase)
setInterval(function() {
  if (!document.getElementById('m').classList.contains('on')) {
    load(false);
  }
}, 60000);
</script>
</body>
</html>
